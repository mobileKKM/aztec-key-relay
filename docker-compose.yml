services:
  aztec-key-relay:
    build: .
    container_name: mkkm-aztec-key-relay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RELAY_DB_PATH: /app/data/state.db
      # Trust X-Forwarded-For from the proxy network so logs show real client
      # IPs. "*" is safe here: the only reachable peers are the proxy and
      # other containers on nginx_proxy (no published ports).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./data:/app/data
    networks:
      - proxy

# The reverse proxy (nginx) fronts the service; it reaches the container by
# container name on the shared external network — no published ports.
networks:
  proxy:
    external: true
    name: nginx_proxy
