services:
  aztec-key-relay:
    build: .
    container_name: mkkm-aztec-key-relay
    restart: unless-stopped
    # Run unprivileged, as the host owner of ./data (SQLite must write there).
    # Set RELAY_UID/RELAY_GID in .env to match `id -u` / `id -g` of that owner.
    user: "${RELAY_UID:-1000}:${RELAY_GID:-1000}"
    env_file:
      - .env
    environment:
      RELAY_DB_PATH: /app/data/state.db
    volumes:
      - ./data:/app/data
    networks:
      - proxy

# The reverse proxy (nginx) fronts the service; it reaches the container by
# container name on the shared external network — no published ports.
networks:
  proxy:
    external: true
    name: nginx_proxy
